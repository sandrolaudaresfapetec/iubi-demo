app = "iubi-demo"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Gateway das APIs IUBI, alcançado pelo servidor (proxy same-origin /iubi).
  IUBI_UPSTREAM = "https://iubi-backend-fapetec.fly.dev"
  AI_MODEL = "llama-3.1-8b-instant"
  OPENAI_BASE_URL = "https://api.groq.com/openai/v1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
